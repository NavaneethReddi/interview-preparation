"Memory Leaks": [
  {q:"Memory lifecycle", d:"Medium", a:"Memory allocation, use, and deallocation form the basic lifecycle in any program. Allocation reserves space for objects, usage reads/writes that memory, and deallocation releases it when no longer needed. In low-level languages allocation and deallocation are explicit; in JavaScript they are implicit and handled by the garbage collector. Even so, web apps — including React apps — can leak memory when references remain after a component should be released.", code:""},

  {q:"How JavaScript's garbage collector works", d:"Medium", a:"Modern JS engines primarily use a mark-and-sweep approach. The collector starts from root objects (globals, stack frames), traverses reachable objects and marks them. In the sweep phase it reclaims objects that were not marked as reachable. Some runtimes also track reference counts; reference counting can mis-handle circular references, which is why mark-and-sweep is preferred in practice.", code:""},

  {q:"Garbage collection in React: component cleanup", d:"Medium", a:"When a React component unmounts, its memory becomes collectible only if nothing holds references to it. Typical sources that keep references alive are global event listeners, active timers, and unresolved async operations. Always remove listeners, clear timers, and cancel or ignore async results in a cleanup to let the GC reclaim component state and handlers.", code:"// Remove listeners and cancel work in useEffect\nuseEffect(() => {\n  const onScroll = () => { /* ... */ };\n  window.addEventListener('scroll', onScroll);\n  return () => {\n    window.removeEventListener('scroll', onScroll);\n    controller.abort?.(); // cancel pending requests if used\n  };\n}, []);"},

  {q:"How memory leaks occur in React apps", d:"Medium", a:"Common leak patterns: forgotten cleanup in useEffect (timers, listeners), long-running or un-aborted async calls that capture component state, closures that retain stale values, refs that keep DOM nodes or heavy instances, and large global stores containing transient objects. Prevent leaks by scoping resources, returning cleanup functions, nulling refs on unmount, and avoiding storing transient UI data in long-lived global state.", code:"// Example: abort fetches, clear intervals, and null refs (see individual patterns above)"}
],
'Node.js': [
  {q:"What is Node.js?", d:"Easy", a:"<strong>Node.js</strong> is a JavaScript runtime built on Chrome's V8 engine that allows JS to run on the server. It uses an <strong>event-driven, non-blocking I/O model</strong>, making it lightweight and efficient for data-intensive applications. Ideal for building APIs, real-time applications, and microservices.", code:"// Simple Node.js server\nconst http = require('http');\nconst server = http.createServer((req, res) => {\n  res.writeHead(200, {'Content-Type': 'text/plain'});\n  res.end('Hello World\\n');\n});\nserver.listen(3000);"},
  {q:"What is the event loop?", d:"Medium", a:"Node.js operates on an <strong>event-driven, non-blocking model</strong>. The event loop continuously checks for events/callbacks in the queue and executes them. It processes <strong>microtasks</strong> (Promises, nextTick), <strong>timers</strong>, I/O operations, and <strong>macrotasks</strong> (setImmediate). Understanding the loop order prevents blocking and performance issues.", code:"console.log('start');\nsetTimeout(() => console.log('timeout'), 0);\nPromise.resolve().then(() => console.log('promise'));\nconsole.log('end');\n// Output: start, end, promise, timeout"},
  {q:"What are callbacks, Promises, and async/await?", d:"Medium", a:"<strong>Callbacks</strong> are functions passed as arguments, prone to callback hell. <strong>Promises</strong> provide better structure with .then()/.catch(). <strong>async/await</strong> is syntactic sugar over Promises, making asynchronous code read like synchronous code. Prefer async/await for clarity.", code:"// Callback (callback hell)\nreadFile('file.txt', (err, data) => {\n  if (err) console.error(err);\n  else console.log(data);\n});\n\n// Promise\nreadFilePromise('file.txt').then(data => console.log(data)).catch(err => console.error(err));\n\n// async/await\nasync function readAndLog() {\n  try {\n    const data = await readFilePromise('file.txt');\n    console.log(data);\n  } catch (err) { console.error(err); }\n}"},
  {q:"What are CommonJS and ES modules?", d:"Medium", a:"<strong>CommonJS</strong> (require/module.exports) is the traditional Node.js module system. <strong>ES modules</strong> (import/export) are the modern standard supported natively in newer Node versions. Set <strong>\"type\": \"module\"</strong> in package.json to use ES modules.", code:"// CommonJS\nconst express = require('express');\nmodule.exports = { app, start };\n\n// ES modules\nimport express from 'express';\nexport { app, start };"},
  {q:"What is the difference between blocking and non-blocking I/O?", d:"Medium", a:"<strong>Blocking I/O</strong> waits for operations to complete before proceeding — thread is occupied. <strong>Non-blocking I/O</strong> initiates operations and continues; callbacks/Promises handle results. Node.js is designed for non-blocking I/O, improving concurrency and throughput.", code:"// Blocking (synchronous) — avoids in Node.js\nconst data = fs.readFileSync('file.txt', 'utf8');\nconsole.log(data);\n\n// Non-blocking (asynchronous)\nfs.readFile('file.txt', 'utf8', (err, data) => {\n  if (!err) console.log(data);\n});\nconsole.log('Reading...');"},
  {q:"What is middleware?", d:"Medium", a:"Middleware are functions that have access to the request (req), response (res), and next middleware. They process requests, modify data, or pass control to the next handler. Used in Express for logging, authentication, error handling, and request transformation.", code:"// Express middleware\napp.use((req, res, next) => {\n  console.log(`${req.method} ${req.url}`);\n  next();\n});\n\napp.use((req, res, next) => {\n  if (!req.headers.authorization) return res.status(401).send('Unauthorized');\n  next();\n});"},
  {q:"What is a stream?", d:"Hard", a:"<strong>Streams</strong> process large data in chunks rather than loading everything into memory. Four types: Readable, Writable, Duplex, Transform. Essential for handling files, network data, and large datasets efficiently. Emit events: 'data', 'end', 'error'.", code:"// Read file as stream\nconst fs = require('fs');\nconst stream = fs.createReadStream('large-file.txt', { highWaterMark: 64 * 1024 });\nstream.on('data', chunk => console.log('Got chunk, size:', chunk.length));\nstream.on('end', () => console.log('Stream ended'));\n\n// Pipe: connect streams\nfs.createReadStream('input.txt').pipe(fs.createWriteStream('output.txt'));"},
  {q:"What are buffers?", d:"Easy", a:"<strong>Buffers</strong> store raw bytes in memory. Used for binary data, file operations, and network I/O. Fixed size, immutable once created. Useful when working with streams, cryptography, or non-text data.", code:"const buf = Buffer.alloc(10);\nbuf.write('Hello');\nconsole.log(buf);\nconsole.log(buf.toString());\n\nconst buf2 = Buffer.from('Node.js', 'utf8');\nconsole.log(buf2.toString());"},
  {q:"What is clustering and why use it?", d:"Hard", a:"<strong>Clustering</strong> creates multiple Node.js worker processes, each with its own event loop. Master process manages workers; each handles requests independently. Leverages multi-core CPUs for improved concurrency and reliability. Critical for production load distribution.", code:"const cluster = require('cluster');\nconst os = require('os');\n\nif (cluster.isMaster) {\n  const numCPUs = os.cpus().length;\n  for (let i = 0; i < numCPUs; i++) cluster.fork();\n} else {\n  require('http').createServer((req, res) => {\n    res.end('Worker ' + process.pid);\n  }).listen(3000);\n}"},
  {q:"How do you handle errors in Node.js?", d:"Medium", a:"Use <strong>try/catch</strong> in async functions, <strong>.catch()</strong> on Promises, or <strong>error handlers</strong> in event emitters. Always validate inputs and log errors. Use centralized error handling middleware in Express. Prevent unhandled rejections with <strong>process.on('unhandledRejection', ...)</strong>.", code:"// Try/catch\nasync function getData() {\n  try {\n    const data = await fetch('/api/data');\n    return data;\n  } catch (err) {\n    console.error('Fetch failed:', err);\n    throw err;\n  }\n}\n\n// Express error middleware\napp.use((err, req, res, next) => {\n  console.error(err);\n  res.status(500).json({ error: err.message });\n});"},
  {q:"What is the difference between process.exit() and process.kill()?", d:"Medium", a:"<strong>process.exit(code)</strong> terminates the current process immediately with an optional exit code (0 for success, non-zero for error). <strong>process.kill(pid, signal)</strong> sends a signal to a different process by PID. Use sparingly; prefer graceful shutdown.", code:"// Exit the process\nif (error) process.exit(1);\n\n// Send signal to another process\nconst childProcess = spawn('node', ['worker.js']);\nif (condition) process.kill(childProcess.pid, 'SIGTERM');"},
  {q:"What are environment variables and .env?", d:"Easy", a:"Environment variables store configuration (API keys, database URLs, ports). Accessed via <strong>process.env</strong>. Use <strong>.env</strong> files with libraries like <strong>dotenv</strong> to manage secrets and config per environment (dev, test, prod).", code:"// .env file\nPORT=3000\nDATABASE_URL=postgres://...\nAPI_KEY=secret123\n\n// Node.js\nrequire('dotenv').config();\nconsole.log(process.env.PORT);"},
  {q:"What is clustering vs child processes?", d:"Hard", a:"<strong>Clustering</strong> (cluster module) automatically manages worker pools, handles IPC, and master-worker communication. <strong>Child processes</strong> (spawn, fork) give finer control but require manual management. Use clustering for web servers, child_process for CPU-bound tasks or running external programs.", code:"// Child process (fork)\nconst { fork } = require('child_process');\nconst worker = fork('worker.js');\nworker.send({ task: 'compute' });\nworker.on('message', result => console.log('Result:', result));"},
  {q:"What is the purpose of package.json and package-lock.json?", d:"Easy", a:"<strong>package.json</strong> declares project dependencies, scripts, metadata, and versions. <strong>package-lock.json</strong> locks exact dependency versions for reproducible installs across environments. Both should be committed to version control.", code:"{\n  \"name\": \"my-app\",\n  \"version\": \"1.0.0\",\n  \"dependencies\": { \"express\": \"^4.18.0\" },\n  \"devDependencies\": { \"jest\": \"^29.0.0\" },\n  \"scripts\": { \"start\": \"node index.js\" }\n}"},
  {q:"What is the event emitter pattern?", d:"Medium", a:"<strong>EventEmitter</strong> allows objects to emit events and listeners subscribe to them. Fundamental to Node.js (streams, servers emit events). Use <strong>.on(event, callback)</strong> to listen, <strong>.emit(event, data)</strong> to trigger, and <strong>.removeListener()</strong> to unsubscribe.", code:"const { EventEmitter } = require('events');\nconst emitter = new EventEmitter();\n\nemitter.on('data', (msg) => console.log('Received:', msg));\nemitter.emit('data', 'Hello!');\n\nemitter.once('done', () => console.log('One-time event'));\nemitter.emit('done'); // fires\nemitter.emit('done'); // does not fire"},
  {q:"What is RESTful API design?", d:"Medium", a:"<strong>REST</strong> uses HTTP methods (GET, POST, PUT, DELETE) on resource endpoints. Resources are nouns (e.g., /users, /posts), actions are HTTP verbs. Status codes convey results (200 OK, 404 Not Found, 500 Server Error). Stateless, cacheable, scalable.", code:"// Express RESTful API\napp.get('/users', (req, res) => res.json(users));\napp.post('/users', (req, res) => {\n  const newUser = { id: Date.now(), ...req.body };\n  users.push(newUser);\n  res.status(201).json(newUser);\n});\napp.put('/users/:id', (req, res) => {\n  const user = users.find(u => u.id == req.params.id);\n  if (user) { Object.assign(user, req.body); res.json(user); }\n  else res.status(404).send('Not found');\n});\napp.delete('/users/:id', (req, res) => {\n  users = users.filter(u => u.id != req.params.id);\n  res.send('Deleted');\n});"},
  {q:"What is authentication vs authorization?", d:"Medium", a:"<strong>Authentication</strong> verifies who you are (login, credentials). <strong>Authorization</strong> checks what you're allowed to do (roles, permissions). Use <strong>JWT, OAuth, sessions</strong> for auth; middleware for authz checks.", code:"// Simple JWT auth\nconst jwt = require('jsonwebtoken');\nconst token = jwt.sign({ userId: 1 }, 'secret', { expiresIn: '1h' });\n\nconst verifyToken = (req, res, next) => {\n  const token = req.headers.authorization?.split(' ')[1];\n  if (!token) return res.status(401).send('No token');\n  try {\n    req.user = jwt.verify(token, 'secret');\n    next();\n  } catch { res.status(403).send('Invalid token'); }\n};\n\napp.get('/protected', verifyToken, (req, res) => {\n  res.json({ user: req.user });\n});"},
  {q:"How do you connect to a database in Node.js?", d:"Medium", a:"Use database drivers or ORMs: <strong>mongoose</strong> (MongoDB), <strong>sequelize/prisma</strong> (SQL), <strong>redis</strong> (cache). Connection pooling, error handling, and graceful shutdown are critical. Always validate queries and use prepared statements to prevent injection.", code:"// MongoDB with Mongoose\nconst mongoose = require('mongoose');\nmongoose.connect('mongodb://localhost/mydb');\n\nconst userSchema = new mongoose.Schema({ name: String, email: String });\nconst User = mongoose.model('User', userSchema);\n\n(async () => {\n  const user = new User({ name: 'John', email: 'john@example.com' });\n  await user.save();\n  const users = await User.find();\n  console.log(users);\n})();"},
  {q:"What is the V8 engine?", d:"Easy", a:"<strong>V8</strong> is Chrome's JavaScript engine, written in C++. Compiles JS to machine code, optimizes with Just-In-Time (JIT) compilation, and manages memory/garbage collection. Node.js is built on V8, enabling high-performance server-side JS execution.", code:""},
  {q:"What is garbage collection in Node.js?", d:"Medium", a:"V8 automatically manages memory via garbage collection, removing unreachable objects. <strong>Mark-and-sweep</strong> is the primary algorithm. Large heaps can cause pauses; monitor with <strong>--inspect</strong> flag and DevTools. Use streams for large datasets to avoid memory bloat.", code:"// Check heap usage\nconsole.log(process.memoryUsage());\n// { rss, heapTotal, heapUsed, external, arrayBuffers }"},
  {q:"What is Express.js?", d:"Easy", a:"<strong>Express</strong> is a minimal, flexible web application framework for Node.js. Simplifies routing, middleware, request/response handling. Provides chainable API for building web servers and APIs quickly. Industry standard for Node.js backend development.", code:"const express = require('express');\nconst app = express();\n\napp.use(express.json());\n\napp.get('/api/users', (req, res) => res.json([ { id: 1, name: 'John' } ]));\n\napp.listen(3000, () => console.log('Server running on port 3000'));"},
  {q:"What are status codes in HTTP?", d:"Easy", a:"HTTP status codes indicate response outcomes: <strong>1xx</strong> (informational), <strong>2xx</strong> (success: 200 OK, 201 Created), <strong>3xx</strong> (redirect: 301 Moved), <strong>4xx</strong> (client error: 400 Bad Request, 404 Not Found, 401 Unauthorized), <strong>5xx</strong> (server error: 500, 503).", code:"app.get('/users/:id', (req, res) => {\n  const user = findUser(req.params.id);\n  if (!user) return res.status(404).json({ error: 'Not found' });\n  res.status(200).json(user);\n});\n\napp.post('/users', (req, res) => {\n  const user = createUser(req.body);\n  res.status(201).json(user);\n});"},
  {q:"What is CORS and how do you enable it?", d:"Medium", a:"<strong>CORS</strong> (Cross-Origin Resource Sharing) allows requests from different domains. By default, browsers block cross-origin requests. Enable with <strong>cors middleware</strong> or by setting <strong>Access-Control-Allow-Origin</strong> header. Configure allowed origins, methods, and credentials.", code:"const cors = require('cors');\nconst app = express();\n\n// Allow all origins\napp.use(cors());\n\n// Allow specific origin\napp.use(cors({\n  origin: 'https://example.com',\n  credentials: true,\n  methods: ['GET', 'POST']\n}));"},
  {q:"What is rate limiting?", d:"Medium", a:"Rate limiting restricts requests from a client within a time window to prevent abuse, DDoS attacks, and API overload. Use middleware like <strong>express-rate-limit</strong> to set max requests per IP per interval. Essential for production APIs.", code:"const rateLimit = require('express-rate-limit');\n\nconst limiter = rateLimit({\n  windowMs: 15 * 60 * 1000, // 15 min\n  max: 100 // max 100 requests per windowMs\n});\n\napp.use('/api/', limiter);\n\napp.get('/api/users', (req, res) => res.json(users));"},
  {q:"What is input validation?", d:"Medium", a:"Input validation checks user-submitted data for correctness, type, and length before processing. Prevents injection attacks, malformed data, and crashes. Use libraries like <strong>joi</strong>, <strong>validator.js</strong>, or <strong>express-validator</strong>. Always validate server-side.", code:"const { body, validationResult } = require('express-validator');\n\napp.post('/users',\n  body('email').isEmail().normalizeEmail(),\n  body('name').trim().notEmpty(),\n  (req, res) => {\n    const errors = validationResult(req);\n    if (!errors.isEmpty()) return res.status(400).json({ errors });\n    const user = createUser(req.body);\n    res.json(user);\n  }\n);"},
  {q:"What is dependency injection?", d:"Medium", a:"Dependency injection passes dependencies to a function/class rather than having it create them. Improves testability, flexibility, and decoupling. Use constructor parameters or container libraries like <strong>InversifyJS</strong>.", code:"// Without DI (tightly coupled)\nclass UserService {\n  constructor() { this.db = new Database(); }\n}\n\n// With DI (loosely coupled)\nclass UserService {\n  constructor(db) { this.db = db; }\n}\n\nconst db = new Database();\nconst userService = new UserService(db);"},
  {q:"What is testing in Node.js?", d:"Medium", a:"Testing verifies code behavior: <strong>Unit tests</strong> (individual functions), <strong>Integration tests</strong> (module interactions), <strong>E2E tests</strong> (full workflows). Popular frameworks: <strong>Jest, Mocha, Vitest</strong>. Use test runners, assertions, and mocking. Aim for high coverage.", code:"// Jest example\nconst sum = (a, b) => a + b;\n\ntest('adds 1 + 2 to equal 3', () => {\n  expect(sum(1, 2)).toBe(3);\n});\n\ntest('user creation', async () => {\n  const user = await createUser({ name: 'John' });\n  expect(user.name).toBe('John');\n});"},
  {q:"What is mocking?", d:"Medium", a:"Mocking replaces real functions/modules with fake versions during tests. Allows testing code in isolation without external dependencies (APIs, databases). Libraries: <strong>jest.mock()</strong>, <strong>sinon</strong>. Enables predictable, fast tests.", code:"const userService = require('./userService');\njest.mock('./userService');\n\nuserService.getUser.mockResolvedValue({ id: 1, name: 'John' });\n\ntest('get user', async () => {\n  const user = await userService.getUser(1);\n  expect(user.name).toBe('John');\n  expect(userService.getUser).toHaveBeenCalledWith(1);\n});"},
  {q:"What is WebSockets?", d:"Hard", a:"<strong>WebSockets</strong> enable persistent, bidirectional communication between client and server over a single TCP connection. Ideal for real-time apps (chat, notifications, live updates). Library: <strong>socket.io</strong> wraps WebSockets with fallbacks.", code:"// Server (socket.io)\nconst io = require('socket.io');\nconst server = require('http').createServer();\nconst socket = io(server);\n\nsocket.on('connection', (client) => {\n  client.on('message', (msg) => {\n    socket.emit('broadcast', msg);\n  });\n});\n\nserver.listen(3000);"},
  {q:"What is caching?", d:"Medium", a:"Caching stores frequently accessed data in fast storage (memory, Redis) to avoid recomputation or database hits. Reduces latency and load. Cache strategies: <strong>LRU, TTL, write-through</strong>. Popular tools: <strong>Redis, Memcached</strong>.", code:"const redis = require('redis');\nconst client = redis.createClient();\n\napp.get('/users/:id', async (req, res) => {\n  const cached = await client.get(`user:${req.params.id}`);\n  if (cached) return res.json(JSON.parse(cached));\n  \n  const user = await db.getUser(req.params.id);\n  await client.setEx(`user:${req.params.id}`, 3600, JSON.stringify(user));\n  res.json(user);\n});"},
  {q:"What is logging?", d:"Easy", a:"Logging records application events for debugging, monitoring, and auditing. Levels: DEBUG, INFO, WARN, ERROR. Use libraries: <strong>winston, pino, bunyan</strong>. Log to files, external services (Sentry, ELK). Production best practice.", code:"const winston = require('winston');\nconst logger = winston.createLogger({\n  transports: [\n    new winston.transports.File({ filename: 'error.log', level: 'error' }),\n    new winston.transports.File({ filename: 'combined.log' })\n  ]\n});\n\nlogger.info('User logged in');\nlogger.error('Database connection failed');"},
  {q:"What is SQL injection and how do you prevent it?", d:"Hard", a:"<strong>SQL injection</strong> exploits unvalidated user input to manipulate SQL queries. Attacker can read, modify, or delete data. Prevention: <strong>parameterized queries (prepared statements), input validation, ORMs</strong>.", code:"// Vulnerable\nconst query = `SELECT * FROM users WHERE email = '${email}'`;\n\n// Safe (parameterized)\nconst query = 'SELECT * FROM users WHERE email = ?';\ndb.query(query, [email]);\n\n// Safe (ORM)\nconst user = await User.findOne({ where: { email } });"},
  {q:"What is pagination?", d:"Medium", a:"Pagination divides large datasets into pages for efficient loading and performance. Prevents memory overload and improves user experience. Implement with <strong>offset/limit</strong> or <strong>cursor-based</strong> pagination. Return total count for client-side awareness.", code:"// Offset/Limit\napp.get('/users', (req, res) => {\n  const page = req.query.page || 1;\n  const limit = req.query.limit || 10;\n  const offset = (page - 1) * limit;\n  const users = User.find().limit(limit).offset(offset);\n  res.json({ users, total: User.count(), page, limit });\n});"},
  {q:"What is API versioning?", d:"Medium", a:"API versioning maintains backward compatibility while introducing breaking changes. Strategies: <strong>URL versioning (/v1/users), header versioning, content negotiation</strong>. Plan versions early; deprecate old versions gradually.", code:"// URL versioning\napp.get('/v1/users', (req, res) => {\n  // Old API\n  res.json(users);\n});\n\napp.get('/v2/users', (req, res) => {\n  // New API with different response structure\n  res.json({ data: users, meta: { total: users.length } });\n});"},
  {q:"What is async/await error handling?", d:"Medium", a:"Use <strong>try/catch</strong> blocks in async functions. Catch promises rejections, I/O errors, and validation failures. Always provide meaningful error messages. Avoid silent failures.", code:"async function getUserData(userId) {\n  try {\n    const user = await User.findById(userId);\n    if (!user) throw new Error('User not found');\n    const posts = await Post.find({ userId });\n    return { user, posts };\n  } catch (err) {\n    console.error('Error fetching user:', err);\n    throw err; // or return default/null based on context\n  }\n}"},
  {q:"What is Docker and containerization?", d:"Hard", a:"<strong>Docker</strong> packages applications with dependencies into containers. Ensures consistency across environments (dev, test, prod). <strong>Dockerfile</strong> defines image; containers run isolated from host OS. Essential for microservices and cloud deployment.", code:"# Dockerfile\nFROM node:18\nWORKDIR /app\nCOPY package*.json ./\nRUN npm install\nCOPY . .\nEXPOSE 3000\nCMD [\"node\", \"index.js\"]\n\n# Build & run\n# docker build -t my-app .\n# docker run -p 3000:3000 my-app"},
  {q:"What is CI/CD?", d:"Medium", a:"<strong>CI (Continuous Integration)</strong> automatically tests code on each commit. <strong>CD (Continuous Deployment)</strong> automatically deploys to production. Reduces manual errors, speeds releases, enables frequent updates. Tools: GitHub Actions, Jenkins, GitLab CI, CircleCI.", code:"# .github/workflows/test.yml\nname: Tests\non: [push, pull_request]\njobs:\n  test:\n    runs-on: ubuntu-latest\n    steps:\n      - uses: actions/checkout@v2\n      - uses: actions/setup-node@v2\n        with:\n          node-version: '18'\n      - run: npm install\n      - run: npm test"},
  {q:"What is npm and package managers?", d:"Easy", a:"<strong>npm</strong> is Node's package manager for installing, managing, and publishing libraries. Alternatives: <strong>yarn, pnpm</strong>. <strong>package.json</strong> lists dependencies; <strong>package-lock.json</strong> locks versions. Use <strong>npm ci</strong> for reproducible installs in CI/CD.", code:"npm init          # Create package.json\nnpm install       # Install dependencies\nnpm install --save-dev jest\nnpm run test      # Run scripts\nnpm publish       # Publish to registry"},
  {q:"What is the difference between .gitignore and .npmignore?", d:"Easy", a:"<strong>.gitignore</strong> prevents files from being committed to Git (node_modules, .env). <strong>.npmignore</strong> prevents files from being published to npm registry (tests, examples, docs). If .npmignore absent, uses .gitignore.", code:"# .gitignore\nnode_modules/\n.env\n*.log\n.DS_Store\n\n# .npmignore\ntest/\nexamples/\n.github/"},
  {q:"What is security: HTTPS and SSL/TLS?", d:"Medium", a:"<strong>HTTPS</strong> encrypts data in transit using <strong>SSL/TLS</strong> protocols. Prevents man-in-the-middle attacks and eavesdropping. Use certificates from authorities (Let's Encrypt, self-signed). Mandatory for sensitive data (auth, payments).", code:"const https = require('https');\nconst fs = require('fs');\nconst express = require('express');\nconst app = express();\n\nconst options = {\n  key: fs.readFileSync('private-key.pem'),\n  cert: fs.readFileSync('certificate.pem')\n};\n\nhttps.createServer(options, app).listen(443);"},
  {q:"What is helmet.js?", d:"Medium", a:"<strong>Helmet.js</strong> middleware sets HTTP headers for security: X-Frame-Options, Content-Security-Policy, X-XSS-Protection. Protects against clickjacking, XSS, MIME type sniffing. Production best practice.", code:"const helmet = require('helmet');\nconst app = require('express')();\n\napp.use(helmet());\n\n// Sets secure headers automatically\napp.get('/', (req, res) => res.send('Secure!'));"},
  {q:"What is XSS (Cross-Site Scripting)?", d:"Hard", a:"<strong>XSS</strong> injects malicious scripts into web pages executed in users' browsers. Attacker steals cookies, sessions, or performs actions. Prevention: sanitize/escape user input, use Content-Security-Policy, avoid innerHTML for user data.", code:"// Vulnerable\nres.send(`<h1>${userInput}</h1>`);\n\n// Safe (escape)\nconst escapeHtml = (text) => {\n  const map = { '&': '&amp;', '<': '&lt;', '>': '&gt;', '\"': '&quot;', \"'\": '&#039;' };\n  return text.replace(/[&<>\"']/g, m => map[m]);\n};\n\nres.send(`<h1>${escapeHtml(userInput)}</h1>`);"},
  {q:"What is environment config management?", d:"Easy", a:"Store config (API keys, database URLs, ports) in environment variables or config files. Never hardcode secrets. Use <strong>.env</strong> files with <strong>dotenv</strong> for local development; use system env vars or secrets managers (AWS Secrets, HashiCorp Vault) in production.", code:"// config.js\nrequire('dotenv').config();\n\nmodule.exports = {\n  port: process.env.PORT || 3000,\n  dbUrl: process.env.DATABASE_URL,\n  apiKey: process.env.API_KEY,\n  nodeEnv: process.env.NODE_ENV || 'development'\n};"},
  {q:"What is graceful shutdown?", d:"Medium", a:"Graceful shutdown cleanly terminates a process: finish in-flight requests, close database/cache connections, release resources. Prevents data loss and incomplete operations. Listen to SIGTERM, SIGINT signals.", code:"const server = app.listen(3000);\n\nprocess.on('SIGTERM', async () => {\n  console.log('SIGTERM received, shutting down gracefully');\n  server.close(async () => {\n    await db.disconnect();\n    await cache.disconnect();\n    process.exit(0);\n  });\n});"},
  {q:"What is load balancing?", d:"Hard", a:"Load balancing distributes requests across multiple servers to improve availability and performance. Strategies: round-robin, least connections, weighted. Tools: Nginx, HAProxy, AWS ELB. Prevents single point of failure.", code:"# Nginx load balancing\nupstream backend {\n  server 127.0.0.1:3000;\n  server 127.0.0.1:3001;\n  server 127.0.0.1:3002;\n}\n\nserver {\n  listen 80;\n  location / {\n    proxy_pass http://backend;\n  }\n}"},
  {q:"What is monitoring and observability?", d:"Medium", a:"Monitoring tracks system health: CPU, memory, latency, errors. Observability (logs, metrics, traces) helps debug issues. Tools: Prometheus, Grafana, DataDog, New Relic. Proactive monitoring prevents outages.", code:"const prometheus = require('prom-client');\n\nconst httpRequestDuration = new prometheus.Histogram({\n  name: 'http_request_duration_seconds',\n  help: 'Duration of HTTP requests in seconds'\n});\n\napp.use((req, res, next) => {\n  const start = Date.now();\n  res.on('finish', () => {\n    httpRequestDuration.observe((Date.now() - start) / 1000);\n  });\n  next();\n});"},
  {q:"What is the difference between require() and import?", d:"Medium", a:"<strong>require()</strong> is CommonJS (synchronous, Node.js default). <strong>import</strong> is ES modules (asynchronous, modern standard). Node.js supports both; use \"type\": \"module\" in package.json for ES modules. import is the future standard.", code:"// CommonJS\nconst express = require('express');\nmodule.exports = app;\n\n// ES modules\nimport express from 'express';\nexport default app;"},
  {q:"What is callback hell and how do you avoid it?", d:"Medium", a:"Callback hell is deeply nested callbacks making code hard to read. Caused by multiple async operations. Solutions: <strong>Promises, async/await, named functions, libraries (async.js)</strong>. Prefer async/await for clarity.", code:"// Callback hell\nreadFile('file1.txt', (err, data1) => {\n  if (err) throw err;\n  readFile('file2.txt', (err, data2) => {\n    if (err) throw err;\n    processData(data1, data2, (err, result) => {\n      console.log(result);\n    });\n  });\n});\n\n// async/await\nasync function process() {\n  const data1 = await readFileAsync('file1.txt');\n  const data2 = await readFileAsync('file2.txt');\n  const result = await processDataAsync(data1, data2);\n  console.log(result);\n}"},
  {q:"What is memory leaks in Node.js?", d:"Hard", a:"Memory leaks occur when objects remain in memory unnecessarily, preventing garbage collection. Common causes: unclosed connections, circular references, retained event listeners, large caches. Monitor with --inspect, use profilers, fix by properly cleaning up resources.", code:"// Memory leak: unclosed connection\nsetInterval(() => {\n  const conn = pool.getConnection(); // never released\n}, 1000);\n\n// Fix: release connection\nsetInterval(async () => {\n  const conn = await pool.getConnection();\n  try {\n    await conn.query('SELECT 1');\n  } finally {\n    conn.release();\n  }\n}, 1000);"},
  {q:"What is the difference between process and child_process?", d:"Hard", a:"<strong>process</strong> is the current Node.js process object; access env vars, signals, exit codes. <strong>child_process</strong> spawns new processes (spawn, fork, exec). Use for CPU-bound tasks, running external programs, worker threads.", code:"// Process\nconsole.log(process.pid);\nprocess.env.NODE_ENV; \nprocess.on('uncaughtException', (err) => console.error(err));\n\n// Child process\nconst { spawn } = require('child_process');\nconst child = spawn('node', ['worker.js']);\nchild.stdout.on('data', (data) => console.log(`stdout: ${data}`));"},
  {q:"What is RegExp (Regular Expressions) in Node.js?", d:"Medium", a:"RegExp are patterns for matching, searching, replacing text. Syntax: /pattern/flags. Flags: g (global), i (case-insensitive), m (multiline). Methods: test(), match(), replace(), split().", code:"const email = /^[^\\s@]+@[^\\s@]+\\.[^\\s@]+$/;\nif (email.test('user@example.com')) console.log('Valid');\n\nconst text = 'Hello 123 World 456';\nconst numbers = text.match(/\\d+/g); // ['123', '456']\nconst masked = text.replace(/\\d/g, 'X'); // 'Hello XXX World XXX'"},
  {q:"What is the difference between synchronous and asynchronous functions?", d:"Easy", a:"<strong>Synchronous</strong> blocks execution until complete (fs.readFileSync). <strong>Asynchronous</strong> returns immediately, result available later via callback/Promise (fs.readFile). Async prevents blocking, improves throughput.", code:"// Synchronous (blocks)\nconst data = fs.readFileSync('file.txt', 'utf8');\nconsole.log(data);\nconsole.log('Done'); // waits for file\n\n// Asynchronous (non-blocking)\nfs.readFile('file.txt', 'utf8', (err, data) => {\n  if (!err) console.log(data);\n});\nconsole.log('Reading...'); // prints immediately"},
  {q:"What is the difference between var, let, and const in Node.js?", d:"Easy", a:"<strong>var</strong>: function-scoped, hoisted, redeclarable (avoid). <strong>let</strong>: block-scoped, temporal dead zone, reassignable. <strong>const</strong>: block-scoped, not reassignable (prefer by default). All exist in Node.js scope rules.", code:"// var (avoid)\\nvar a = 1;\\nvar a = 2; // ok (redeclare)\\n\\n// let\\nlet b = 1;\\n// let b = 2; // error (redeclare)\\nb = 2; // ok (reassign)\\n\\n// const (prefer)\\nconst c = 1;\\n// c = 2; // error\\nconst arr = [1, 2];\\narr.push(3); // ok (mutate)"},
  {q:"What is the fs module?", d:"Easy", a:"<strong>fs (File System)</strong> module provides file I/O operations. Key methods: readFile, writeFile, unlink, mkdir, readdir. Use async versions to prevent blocking.", code:"const fs = require(\\'fs\\').promises;\\nconst data = await fs.readFile(\\'file.txt\\', \\'utf8\\');\\nawait fs.writeFile(\\'out.txt\\', data);"},
  {q:"What is the path module?", d:"Easy", a:"<strong>path</strong> module provides utilities for working with file and directory paths. Methods: join, resolve, dirname, basename, extname.", code:"const path = require(\\'path\\');\\npath.join(\\'/foo\\', \\'bar\\'); // \\'/foo/bar\\'\\npath.dirname(\\'/foo/bar/file.txt\\'); // \\'/foo/bar\\'\\npath.basename(\\'/foo/bar/file.txt\\'); // \\'file.txt\\'"}
],
};

let activeTab = 'HTML';
let activeFilter = 'all';
let expanded = new Set();
let viewed = new Set();
let bookmarked = new Set();

function toggleTheme() {
  const html = document.documentElement;
  const next = html.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
  html.setAttribute('data-theme', next);
  localStorage.setItem('theme', next);
  updateThemeButton(next);
  renderTabs();
  renderStats();
  updateSection();
}

function updateThemeButton(theme) {
  const icon = document.getElementById('theme-icon');
  const label = document.getElementById('theme-label');
  if (theme === 'dark') {
    icon.innerHTML = '&#127769;';
    label.textContent = 'Dark';
  } else {
    icon.innerHTML = '&#9728;';
    label.textContent = 'Light';
  }
}

function tabClass(t) {
  const map = { HTML:'active-html', CSS:'active-css', JavaScript:'active-js', React:'active-react', TypeScript:'active-ts', Performance:'active-perf', 'Micro Frontend':'active-mfe', 'Memory Leaks':'active-memory', 'Node.js':'active-nodejs' };
  return map[t] || '';
}

function renderStats() {
  const grid = document.getElementById('stats-grid');
  if (!grid) return;
  const total = Object.values(DATA).reduce((a, arr) => a + arr.length, 0);
  grid.innerHTML = TABS.map(t => {
    const c = getColor(t);
    const viewedInCat = DATA[t].filter((_, i) => viewed.has(t+'-'+i)).length;
    const pct = DATA[t].length ? Math.round((viewedInCat / DATA[t].length) * 100) : 0;
    return `<div class="stat-card" style="--stat-color:${c}">
      <span class="stat-num" style="color:${c}">${DATA[t].length}</span>
      <span class="stat-lbl">${t}</span>
      <div class="stat-bar-mini"><div class="stat-bar-fill" style="width:${pct}%;background:${c}"></div></div>
    </div>`;
  }).join('') + `<div class="stat-card" style="--stat-color:var(--accent)">
    <span class="stat-num" style="color:var(--accent)" id="viewed-count">${viewed.size}</span>
    <span class="stat-lbl">Viewed</span>
    <div class="stat-bar-mini"><div class="stat-bar-fill" id="stat-viewed-fill" style="width:${Math.round((viewed.size/total)*100)}%;background:var(--accent)"></div></div>
  </div>`;
}

function renderTabs() {
  document.getElementById('tabs').innerHTML = TABS.map(t => {
    const isActive = t === activeTab;
    return `<button class="tab${isActive ? ' '+tabClass(t) : ''}" onclick="setTab('${t}')">
      <span class="dot" style="background:${getColor(t)}"></span>${t}<span class="cnt">${DATA[t].length}</span>
    </button>`;
  }).join('');
}

function setTab(t) {
  activeTab = t;
  expanded.clear();
  renderTabs();
  renderCards();
  updateSection();
}

function setFilter(f) {
  activeFilter = f;
  ['all','Easy','Medium','Hard','bookmarked'].forEach(k => {
    const el = document.getElementById(`f-${k}`);
    if(el) el.classList.toggle('inactive', k !== f);
  });
  renderCards();
}

function updateSection() {
  const dot = document.getElementById('section-dot');
  const title = document.getElementById('section-title');
  if(dot) dot.style.background = getColor(activeTab);
  if(title) title.textContent = activeTab;
}

function renderCards() {
  const q = document.getElementById('search').value.toLowerCase();
  const items = DATA[activeTab].filter((item, i) => {
    const matchSearch = !q || item.q.toLowerCase().includes(q) || item.a.toLowerCase().includes(q);
    const matchFilter = activeFilter === 'all' ? true :
      activeFilter === 'bookmarked' ? bookmarked.has(activeTab+'-'+i) :
      item.d === activeFilter;
    return matchSearch && matchFilter;
  });

  const container = document.getElementById('cards');
  const emptyEl = document.getElementById('empty');
  const countEl = document.getElementById('section-count');

  if(countEl) countEl.textContent = `${items.length} question${items.length !== 1 ? 's' : ''}`;

  if(!items.length) {
    container.innerHTML = '';
    emptyEl.style.display = 'block';
    return;
  }
  emptyEl.style.display = 'none';

  const tabKey = activeTab.toLowerCase().replace('javascript','js').replace('typescript','ts').replace('performance','perf').replace('micro frontend','mfe').replace('memory leaks','memory').replace('node.js','nodejs').replace(/ /g,'');

  container.innerHTML = items.map((item, idx) => {
    const i = DATA[activeTab].indexOf(item);
    const key = `${activeTab}-${i}`;
    const isOpen = expanded.has(key);
    const isBookmarked = bookmarked.has(key);
    const diffClass = item.d === 'Easy' ? 'diff-easy' : item.d === 'Medium' ? 'diff-med' : 'diff-hard';
    const openClass = isOpen ? `open-${tabKey}` : '';
    const delay = `animation-delay:${idx * 0.03}s`;

    return `<div class="qcard${isOpen ? ' expanded ' + openClass : ''}" style="${delay}" id="card-${key}">
      <div class="qheader" onclick="toggle('${key}')">
        <div class="qnum">${String(idx+1).padStart(2,'0')}</div>
        <div class="qtitle">${item.q}</div>
        <div class="qmeta">
          <span class="diff ${diffClass}">${item.d}</span>
          <button class="bookmark-btn${isBookmarked ? ' bookmarked' : ''}" onclick="toggleBookmark(event, '${key}')">
            <svg width="14" height="14" fill="${isBookmarked ? 'currentColor' : 'none'}" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path d="M19 21l-7-5-7 5V5a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2z"/></svg>
          </button>
          <div class="chevron">
            <svg width="14" height="14" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><path d="m6 9 6 6 6-6"/></svg>
          </div>
        </div>
      </div>
      <div class="qbody">
        <div class="qbody-inner">
          <div class="answer-text">${item.a}</div>
          ${item.code ? `<div class="code-block">
            <div class="code-header">
              <span class="code-lang">code example</span>
              <button class="copy-btn" onclick="copyCode(event, '${key}')">
                <svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg>
                copy
              </button>
            </div>
            <pre id="code-${key}">${item.code}</pre>
          </div>` : ''}
        </div>
      </div>
    </div>`;
  }).join('');
}

function toggle(key) {
  // If the DOM card exists, toggle its expanded class directly
  const el = document.getElementById('card-' + key);
  if (el) {
    const wasOpen = el.classList.contains('expanded');
    if (wasOpen) {
      el.classList.remove('expanded');
      expanded.delete(key);
    } else {
      el.classList.add('expanded');
      expanded.add(key);
      viewed.add(key);
      updateViewedCount();
    }
    updateProgress();
    renderStats();
    return;
  }

  // Fallback when card not present in DOM (e.g. after filters changed)
  if (expanded.has(key)) {
    expanded.delete(key);
  } else {
    expanded.add(key);
    viewed.add(key);
    updateViewedCount();
  }
  renderCards();
  updateProgress();
  renderStats();
}

function toggleBookmark(event, key) {
  event.stopPropagation();
  if(bookmarked.has(key)) bookmarked.delete(key);
  else bookmarked.add(key);
  renderCards();
}

function updateViewedCount() {
  const el = document.getElementById('viewed-count');
  if(el) el.textContent = viewed.size;
}

function updateProgress() {
  const total = Object.values(DATA).reduce((a, arr) => a + arr.length, 0);
  const pct = Math.round((viewed.size / total) * 100);
  const el = document.getElementById('progress');
  const txt = document.getElementById('progress-text');
  if(el) el.style.width = pct + '%';
  if(txt) txt.textContent = `${viewed.size} / ${total} viewed`;
}

function copyCode(event, key) {
  event.stopPropagation();
  const pre = document.getElementById(`code-${key}`);
  if(!pre) return;
  const text = pre.textContent.replace(/&lt;/g,'<').replace(/&gt;/g,'>').replace(/&amp;/g,'&');
  navigator.clipboard.writeText(text).then(() => {
    const btn = event.currentTarget;
    btn.classList.add('copied');
    btn.innerHTML = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24"><polyline points="20,6 9,17 4,12"/></svg> copied!`;
    setTimeout(() => {
      btn.classList.remove('copied');
      btn.innerHTML = `<svg width="12" height="12" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><rect width="14" height="14" x="8" y="8" rx="2"/><path d="M4 16c-1.1 0-2-.9-2-2V4c0-1.1.9-2 2-2h10c1.1 0 2 .9 2 2"/></svg> copy`;
    }, 2000);
  });
}

function clearSearch() {
  document.getElementById('search').value = '';
  document.getElementById('search-wrap').classList.remove('has-value');
  expanded.clear();
  renderCards();
}

const searchInput = document.getElementById('search');
searchInput.addEventListener('input', () => {
  document.getElementById('search-wrap').classList.toggle('has-value', searchInput.value.length > 0);
  expanded.clear();
  renderCards();
});

// Sticky bar shadow on scroll
const stickyBar = document.getElementById('sticky-bar');
const backToTop = document.getElementById('back-to-top');
window.addEventListener('scroll', () => {
  stickyBar.classList.toggle('scrolled', window.scrollY > 100);
  backToTop.classList.toggle('visible', window.scrollY > 400);
}, { passive: true });

// Init
const savedTheme = localStorage.getItem('theme') || 'light';
document.documentElement.setAttribute('data-theme', savedTheme);
updateThemeButton(savedTheme);

const total = Object.values(DATA).reduce((a, arr) => a + arr.length, 0);
document.getElementById('progress-text').textContent = `0 / ${total} viewed`;

setFilter('all');
renderStats();
renderTabs();
updateSection();
renderCards();
</script>
