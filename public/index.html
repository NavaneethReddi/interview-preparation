<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Frontend Interview Prep</title>
<link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect fill='%232563eb' width='100' height='100'/><text x='50' y='65' font-size='60' font-weight='bold' text-anchor='middle' fill='white' font-family='Arial'>?</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com" />

<link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Mono:ital,wght@0,300;0,400;0,500;1,400&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;1,9..40,400&display=swap" rel="stylesheet" />
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  :root {
    --bg: #f4f5f9;
    --bg-card: #ffffff;
    --bg-hover: #eef0f6;
    --bg-code: #1a1d27;
    --border: rgba(0,0,0,0.06);
    --border-md: rgba(0,0,0,0.12);
    --text: #0f1117;
    --text-sub: #3d4460;
    --text-dim: #8891aa;
    --accent: #2563eb;
    --accent-dim: rgba(37,99,235,0.08);
    --accent-glow: rgba(37,99,235,0.2);
    --html: #e85d1a;
    --html-dim: rgba(232,93,26,0.08);
    --css: #1e6fd9;
    --css-dim: rgba(30,111,217,0.08);
    --js: #b8890e;
    --js-dim: rgba(184,137,14,0.08);
    --react: #0794b8;
    --react-dim: rgba(7,148,184,0.08);
    --ts: #2563eb;
    --ts-dim: rgba(37,99,235,0.08);
    --perf: #6d28d9;
    --perf-dim: rgba(109,40,217,0.08);
    --mfe: #0891b2;
    --mfe-dim: rgba(8,145,178,0.08);
    --easy: #16a34a;
    --easy-dim: rgba(22,163,74,0.08);
    --med: #d97706;
    --med-dim: rgba(217,119,6,0.08);
    --hard: #dc2626;
    --hard-dim: rgba(220,38,38,0.08);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.04), 0 1px 3px rgba(0,0,0,0.03);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.06), 0 2px 4px rgba(0,0,0,0.03);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.08);
    --radius: 14px;
    --radius-sm: 10px;
    --font-head: 'Syne', sans-serif;
    --font-body: 'DM Sans', sans-serif;
    --font-mono: 'DM Mono', monospace;
    --grid-color: rgba(0,0,0,0.03);
  }

  [data-theme="dark"] {
    --bg: #0b0d12;
    --bg-card: #13161e;
    --bg-hover: #1a1e2a;
    --bg-code: #090b10;
    --border: rgba(255,255,255,0.06);
    --border-md: rgba(255,255,255,0.12);
    --text: #eaecf4;
    --text-sub: #8891aa;
    --text-dim: #4f576e;
    --accent: #5b8df5;
    --accent-dim: rgba(91,141,245,0.1);
    --accent-glow: rgba(91,141,245,0.25);
    --html: #ff7444;
    --html-dim: rgba(255,116,68,0.1);
    --css: #5b9cf5;
    --css-dim: rgba(91,156,245,0.1);
    --js: #f7ca48;
    --js-dim: rgba(247,202,72,0.1);
    --react: #5dd3f3;
    --react-dim: rgba(93,211,243,0.1);
    --ts: #5b8df5;
    --ts-dim: rgba(91,141,245,0.1);
    --perf: #a78bfa;
    --perf-dim: rgba(167,139,250,0.1);
    --mfe: #22d3ee;
    --mfe-dim: rgba(34,211,238,0.1);
    --easy: #4ade80;
    --easy-dim: rgba(74,222,128,0.1);
    --med: #fb923c;
    --med-dim: rgba(251,146,60,0.1);
    --hard: #f87171;
    --hard-dim: rgba(248,113,113,0.1);
    --shadow-sm: 0 1px 2px rgba(0,0,0,0.2), 0 1px 3px rgba(0,0,0,0.12);
    --shadow-md: 0 4px 12px rgba(0,0,0,0.3), 0 2px 4px rgba(0,0,0,0.15);
    --shadow-lg: 0 12px 40px rgba(0,0,0,0.4);
    --grid-color: rgba(255,255,255,0.02);
  }

  html { scroll-behavior: smooth; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
    overflow-x: hidden;
    transition: background 0.3s, color 0.3s;
  }

  /* trimmed for brevity in copy */
</style>
</head>
